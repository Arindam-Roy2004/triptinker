<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="description" content="Turn a free-form travel brief into an editable, day-by-day itinerary." />
    <meta name="application-name" content="TripTinker" />
    <meta name="apple-mobile-web-app-title" content="TripTinker" />
    <meta property="og:site_name" content="TripTinker" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://triptinker.royarindam.page/" />
    <meta property="og:title" content="TripTinker | Plan a trip in one sentence" />
    <meta property="og:description" content="Turn a free-form travel brief into an editable, day-by-day itinerary." />
    <!-- The homepage as a visitor first sees it, captured by scripts/og-image.mjs. Absolute,
         because most link scrapers ignore a relative image. -->
    <meta property="og:image" content="https://triptinker.royarindam.page/og.png?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The TripTinker homepage: “Where to next? Say it in one sentence.” over a mountain landscape." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The TripTinker app tile. ?v= busts tabs that cached an older icon. -->
    <link rel="icon" type="image/svg+xml" href="/triptinker-mark.svg?v=6" />
    <link rel="icon" href="/favicon.ico?v=6" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png?v=6" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6" />
    <link rel="manifest" href="/site.webmanifest?v=6" />
    <title>TripTinker | Plan a trip in one sentence</title>
    <script>
      // Apply the theme before first paint. Fall back to the old key until startup migrates it.
      try {
        var t = localStorage.getItem('triptinker:theme') ?? localStorage.getItem('roamfar:theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <script>
      // Discover this visit's hero image before the React bundle arrives. Keep these scene
      // paths and responsive sizes in sync with features/scenes/scenes.ts and scene-images.ts.
      (function () {
        var visit = 0;
        try {
          var previous = Number.parseInt(localStorage.getItem('triptinker:scene-visit') ?? localStorage.getItem('roamfar:scene-visit') ?? '-1', 10);
          if (Number.isFinite(previous) && previous >= -1) visit = ((previous % 14) + 1) % 14;
        } catch (e) {}
        document.documentElement.dataset.sceneVisit = String(visit);
        var base = '/scenes/scene-' + (visit + 1);
        var preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.imageSrcset = base + '-960.webp 960w, ' + base + '-1920.webp 1920w';
        preload.imageSizes = '(min-width: 1104px) 1104px, 100vw';
        preload.href = base + '-1920.webp';
        preload.fetchPriority = 'high';
        document.head.appendChild(preload);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
